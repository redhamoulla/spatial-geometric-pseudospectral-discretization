[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geometric-pseudospectral-ph"
version = "0.1.0"
description = "Reproduction of Moulla–Lefèvre–Maschke (2012) and energy-consistent time integration"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3"]

[project.optional-dependencies]
figures = ["reportlab>=4,<5"]

[tool.setuptools.packages.find]
where = ["src"]
